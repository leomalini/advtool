<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#dcdee4;font-family:'Hanken Grotesk',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#1a1c22}
button{font-family:inherit}

/* ── Barra do protótipo (fora do app) ── */
.toolbar{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 16px;background:rgba(255,255,255,.94);border-bottom:1px solid #cfd2da;font-size:13px}
.toolbar .tb-title{font-weight:700}
.toolbar .tb-note{color:#6b7280}
.tb-group{display:flex;align-items:center;gap:6px}
.tb-group>span{color:#6b7280}
.tb-seg{display:inline-flex;background:#eceef2;border-radius:8px;padding:2px}
.tb-seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:12.5px;color:#4b5060;cursor:pointer}
.tb-seg button.on{background:#fff;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stage{padding:20px 16px 48px}
.device{width:1440px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(16,24,40,.18)}

/* ── Tokens Graphite (src/app/globals.css) ── */
.device{--bg:#fafafb;--fg:#1a1c22;--card:#fff;--muted:#f2f3f5;--mfg:#6b7280;--accent:#5165f0;--accent-bg:rgba(81,101,240,.09);--danger:#dc5068;--border:#e6e6ea;--success:#0f9d6a;--warning:#c07b12;--info:#1a90b8;--c1:#5165f0;--c2:#8161e6;--c3:#d456a0;--c4:#d99a2b;--c5:#0f9d6a;--primary:#1a1c22;--on-primary:#fff;--sidebar:#fff;--sidebar-border:#ececef;--hover:rgba(26,28,34,.035);--shadow:0 1px 2px rgba(16,24,40,.04);--lift:0 8px 24px rgba(16,24,40,.09);--neutral-mark:#a3a8b3;--ink-soft:rgba(26,28,34,.8)}
.device[data-theme=dark]{--bg:#0b0d11;--fg:#e7e9ee;--card:#14181e;--muted:#1a1f27;--mfg:#8b929c;--accent:#8ea2ff;--accent-bg:rgba(142,162,255,.12);--danger:#f2657a;--border:rgba(255,255,255,.08);--success:#3ecf8e;--warning:#f5b544;--info:#38bdf8;--c1:#6b8afd;--c2:#b07cf0;--c3:#ec6ead;--c4:#f5b544;--c5:#3ecf8e;--primary:#eef0f4;--on-primary:#0b0d11;--sidebar:#0e1116;--sidebar-border:rgba(255,255,255,.06);--hover:rgba(255,255,255,.035);--shadow:none;--lift:0 8px 24px rgba(0,0,0,.4);--neutral-mark:#5b6270;--ink-soft:rgba(231,233,238,.82)}
.t-accent{--tone:var(--accent)}.t-info{--tone:var(--info)}.t-warning{--tone:var(--warning)}.t-success{--tone:var(--success)}.t-danger{--tone:var(--danger)}.t-violet{--tone:var(--c2)}.t-muted{--tone:var(--mfg)}

/* ── Shell ── */
.app{display:flex;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.4;min-height:860px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.s14{width:14px;height:14px}.ic.s18{width:18px;height:18px}
.sidebar{width:224px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--sidebar-border);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;height:40px;padding:0 8px;margin-bottom:12px;font-weight:800;letter-spacing:-.01em;font-size:15px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800}
.nav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:color-mix(in srgb,var(--fg) 62%,transparent);font-size:13.5px;font-weight:500}
.nav.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav b{margin-left:auto;font-size:11px;min-width:20px;height:18px;border-radius:9px;display:grid;place-items:center;background:var(--warning);color:#fff;padding:0 6px}
.shell{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--card)}
.topbar h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:34px;width:260px;padding:0 10px;border:1px solid var(--border);border-radius:8px;color:var(--mfg);font-size:13px}
.search kbd{margin-left:auto;font:500 11px 'JetBrains Mono',monospace;border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.tbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--mfg);position:relative}
.tbtn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--card)}
.main{flex:1;padding:24px;container-type:inline-size;container-name:main}
.device.phone{width:390px}
.device.phone .sidebar,.device.phone .search{display:none}
.device.phone .main{padding:16px}
.device.phone .topbar{padding:0 12px}
.menu-btn{display:none}
.device.phone .menu-btn{display:grid}

/* ── Primitivos ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);min-width:0;position:relative}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;min-height:54px}
.card-t{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.card-sub{font-size:13px;color:var(--mfg);font-weight:500;white-space:nowrap}
.card-a{margin-left:auto;display:flex;align-items:center;gap:10px}
.card-b{padding:0 8px 8px}
.card-f{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;padding:10px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--mfg)}
.chip-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;color:var(--tone);background:color-mix(in srgb,var(--tone) 13%,transparent)}
.link{font-size:12.5px;font-weight:600;color:var(--mfg);text-decoration:none;display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:none;border:0;padding:0;white-space:nowrap}
.link:hover{color:var(--fg)}
.link.strong{color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--tone);background:color-mix(in srgb,var(--tone) 12%,transparent)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{opacity:.9}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--muted);max-width:100%;overflow-x:auto}
.seg button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:0;border-radius:7px;background:transparent;font-size:12.5px;font-weight:500;color:var(--mfg);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(16,24,40,.08),0 0 0 1px var(--border)}
.seg .n{font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--tone,var(--mfg)) 14%,transparent);color:var(--tone,var(--mfg))}
.avatar{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex-shrink:0;background:var(--av)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;font-weight:500;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.empty{display:flex;align-items:center;gap:12px;padding:10px 8px 12px}
.empty .chip-ic{width:32px;height:32px;border-radius:50%}
.empty p{margin:0;font-size:13.5px;font-weight:600}
.empty small{display:block;font-size:12.5px;color:var(--mfg);font-weight:400;margin-top:1px}
.empty .btn{margin-left:auto}

/* ── Linhas ── */
.row{position:relative;display:flex;align-items:flex-start;gap:12px;padding:9px 8px;border-radius:10px;transition:background .15s,opacity .25s,transform .25s}
.row:hover{background:var(--hover)}
.r-main{min-width:0;flex:1}
.r-t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-m{font-size:12.5px;color:var(--mfg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-x{font-size:13px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-end{display:flex;align-items:center;gap:8px;flex-shrink:0;align-self:center}
.r-act{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.row:hover .r-act,.row:focus-within .r-act{opacity:1}
.ibtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;border:0;background:transparent;color:var(--mfg);cursor:pointer}
.ibtn:hover{background:var(--muted);color:var(--fg)}
.row.leaving{opacity:0;transform:translateX(16px)}
.check{width:18px;height:18px;margin-top:1px;border-radius:50%;border:2px solid color-mix(in srgb,var(--fg) 28%,transparent);background:transparent;display:grid;place-items:center;cursor:pointer;color:transparent;padding:0;flex-shrink:0;transition:.15s}
.check:hover{border-color:var(--success);color:var(--success)}
.check.done{background:var(--success);border-color:var(--success);color:#fff}
.done-t{text-decoration:line-through;color:var(--mfg)}
.subhead{display:flex;align-items:center;gap:8px;padding:8px 8px 2px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mfg)}
.subhead.danger{color:var(--danger)}

/* ── Layout do dashboard ── */
.dash{display:flex;flex-direction:column;gap:16px}
.cols{display:flex;flex-direction:column;gap:16px}
.cols>.col{display:contents}
@container main (min-width: 940px){
  .cols{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);align-items:start}
  .cols>.col{display:flex;flex-direction:column;gap:16px;min-width:0}
}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}

/* ── Hoje ── */
.hero{overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 150% at 100% 0%,var(--accent-bg),transparent 62%);pointer-events:none}
.hero-top{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:20px 18px 14px}
@container main (min-width: 780px){.hero-top{grid-template-columns:minmax(0,1fr) auto;padding:22px 24px 16px;align-items:end}}
.hello h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.025em}
.hello .date{margin-top:2px;color:var(--mfg);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--fg)}
.chip[class*=t-]{border-color:color-mix(in srgb,var(--tone) 28%,transparent);background:color-mix(in srgb,var(--tone) 8%,var(--card))}
.chip[class*=t-] .ic{color:var(--tone)}
.chip strong{font-weight:700}
.chip .live{width:7px;height:7px;border-radius:50%;background:var(--tone)}
.hero-r{display:flex;flex-direction:column;gap:12px;align-items:stretch}
@container main (min-width: 780px){.hero-r{align-items:flex-end}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
@container main (min-width: 780px){.week{grid-template-columns:repeat(7,56px)}}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--fg);transition:background .15s}
.day:hover{background:var(--hover)}
.day .wd{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mfg)}
.day .dn{font-size:17px;font-weight:700;line-height:1.1}
.day .dots{display:flex;gap:3px;height:6px;align-items:center}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.day .dots em{font-size:10px;font-style:normal;color:var(--mfg);line-height:1}
.day.today:not(.sel){border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.day.today:not(.sel) .dn{color:var(--accent)}
.day.sel{background:var(--accent);border-color:var(--accent)}
.day.sel .wd,.day.sel .dn,.day.sel .dots em{color:#fff}
.day.sel .dots i{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.ruler{position:relative;margin:0 24px;padding-top:18px}
.ruler .hours{position:absolute;top:0;left:0;right:0;height:16px;font-size:11px;font-weight:500;color:var(--mfg)}
.ruler .hours span{position:absolute;transform:translateX(-50%)}
.track{position:relative;height:30px;border-radius:8px;background:var(--muted);overflow:hidden}
.track .gridh{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--fg) 7%,transparent)}
.block{position:absolute;border-radius:5px;background:var(--c);cursor:pointer;transition:filter .15s}
.block:hover{filter:brightness(1.08)}
.pin{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--card);border:2.5px solid var(--info);cursor:pointer;z-index:2}
.past{position:absolute;top:0;bottom:0;left:0;background:color-mix(in srgb,var(--card) 55%,transparent);z-index:3;pointer-events:none}
.nowline{position:absolute;top:14px;bottom:-4px;width:2px;margin-left:-1px;background:var(--danger);border-radius:1px;z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-2px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
@container main (max-width: 639px){.ruler{display:none}}
.dayhead{display:flex;align-items:center;gap:8px;padding:14px 24px 2px;font-size:12.5px;color:var(--mfg)}
.dayhead strong{color:var(--fg);font-size:13px}
.dayhead .link{margin-left:auto}
.alist{padding:4px 12px 12px}
.allday{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px 4px}
.arow{display:grid;grid-template-columns:70px 3px minmax(0,1fr) auto;align-items:center;column-gap:12px;padding:8px 10px;border-radius:10px;position:relative;cursor:pointer;transition:background .15s,opacity .2s}
.arow:hover{background:var(--hover)}
.arow.past{opacity:.5}
.arow.current{background:var(--accent-bg)}
.atime{font-size:13px;font-weight:600}
.atime small{display:block;font-weight:400;color:var(--mfg);font-size:12px}
.abar{width:3px;align-self:stretch;border-radius:2px;background:var(--c)}
.atitle{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;font-weight:600}
.atitle span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ameta{font-size:12.5px;color:var(--mfg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.aend{display:flex;align-items:center;gap:8px}
@container main (max-width: 639px){.arow{grid-template-columns:52px 3px minmax(0,1fr)}.aend .avatar{display:none}.aend{grid-column:3;justify-self:start;margin-top:4px}}
.now-div{display:flex;align-items:center;gap:8px;margin:3px 10px;color:var(--danger);font-size:11.5px;font-weight:700}
.now-div::after{content:"";flex:1;height:2px;background:var(--danger);border-radius:1px;opacity:.75}
.hero-empty{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:0 18px 16px;padding:12px 14px;border-radius:12px;background:var(--muted)}
@container main (min-width: 780px){.hero-empty{margin:2px 24px 20px}}
.hero-empty .chip-ic{width:34px;height:34px;border-radius:50%}
.hero-empty p{margin:0;font-weight:600;font-size:14px}
.hero-empty small{display:block;font-size:12.5px;color:var(--mfg);font-weight:400;margin-top:1px}
.hero-empty .btn{margin-left:auto}

/* ── Indicadores ── */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@container main (min-width: 720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);text-decoration:none;color:inherit;cursor:pointer;transition:box-shadow .2s,transform .2s,border-color .2s;min-width:0}
.kpi:hover{box-shadow:var(--lift);transform:translateY(-1px);border-color:color-mix(in srgb,var(--fg) 14%,transparent)}
.kpi-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mfg);min-width:0}
.kpi-h .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-go{margin-left:auto;opacity:0;transition:opacity .2s}
.kpi:hover .kpi-go{opacity:1}
.kpi-m{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:34px}
.kpi-v{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.kpi-v.danger{color:var(--danger)}
.kpi-v .cur{font-size:16px;font-weight:600;color:var(--mfg);letter-spacing:0;margin-right:3px}
.kpi-z{width:min(124px,50%);flex-shrink:0}
.kpi-f{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mfg);min-height:18px}
.kpi-f.warn{color:var(--warning)}.kpi-f.danger{color:var(--danger)}.kpi-f.ok{color:var(--success)}
@container main (max-width: 560px){.kpi-m{flex-direction:column;align-items:stretch}.kpi-z{width:100%}.kpi-v{font-size:26px}.kpi-h{align-items:flex-start}.kpi-h .lbl{white-space:normal;line-height:1.25}}
.meter{height:6px;border-radius:3px;background:color-mix(in srgb,var(--accent) 16%,transparent);overflow:hidden}
.meter span{display:block;height:100%;border-radius:3px;background:var(--accent)}
.stack{display:flex;gap:2px;height:8px}
.stack span{display:block;height:100%;min-width:3px}
.stack span:first-child{border-radius:4px 0 0 4px}.stack span:last-child{border-radius:0 4px 4px 0}.stack span:only-child{border-radius:4px}
.stack.empty{background:var(--muted);border-radius:4px}
.spark{display:block;width:100%;height:32px;overflow:visible}

/* ── Monitoramento ── */
.status{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:600;color:var(--fg);cursor:pointer}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--tone)}
.status[class*=t-]{border-color:color-mix(in srgb,var(--tone) 30%,transparent);background:color-mix(in srgb,var(--tone) 8%,var(--card))}
.status .ic{color:var(--mfg)}
.pop{position:absolute;right:12px;top:52px;z-index:20;width:360px;max-width:calc(100% - 24px);background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--lift);padding:12px 14px;font-size:12.5px}
.pop h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px}
.pop .ln{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--border);color:var(--mfg)}
.pop .ln:first-of-type{border-top:0}
.pop .ln b{color:var(--fg);font-weight:600}
.tabs-row{display:flex;align-items:center;gap:12px;padding:0 16px 6px;flex-wrap:wrap}
.hist{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mfg)}
.hist svg{width:84px;height:24px;overflow:visible}
.count{min-width:40px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--info);background:color-mix(in srgb,var(--info) 12%,transparent);flex-shrink:0}
.newdot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:6px;vertical-align:middle}
.orphan{display:inline-flex;align-items:center;gap:5px;margin-top:3px;font-size:12px;font-weight:600;color:var(--warning)}
.orphan a{color:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.peek{position:absolute;left:56px;right:16px;top:calc(100% - 4px);z-index:15;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--lift);padding:8px 10px;font-size:12.5px;opacity:0;pointer-events:none;transform:translateY(-4px);transition:.15s}
.row:hover>.peek{opacity:1;transform:none}
.peek div{display:flex;gap:10px;padding:3px 0;color:var(--ink-soft)}
.peek div span:first-child{color:var(--mfg);width:40px;flex-shrink:0}
.pubdot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--tone)}

/* ── Financeiro ── */
.fin-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;padding:2px 16px 14px}
@container main (min-width: 720px){.fin-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fin-stats dt{font-size:12.5px;color:var(--mfg);font-weight:500}
.fin-stats dd{margin:2px 0 0;font-size:20px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.fin-stats dd small{display:block;font-size:12px;font-weight:500;letter-spacing:0;color:var(--mfg);margin-top:1px}
.fin-body{display:grid;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--border)}
@container main (min-width: 720px){.fin-body{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.fin-body>section+section{border-left:1px solid var(--border)}}
.fin-body>section{padding:12px 8px 8px;min-width:0}
.fin-body h5{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;padding:0 8px 6px;font-size:12.5px;font-weight:700;color:var(--fg)}
.legend{display:flex;gap:12px;font-size:12px;font-weight:500;color:var(--mfg)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.fin-body>section.grow{display:flex;flex-direction:column}
.flow{position:relative;flex:1;min-height:150px;margin:4px 8px 0 40px;display:flex;flex-direction:column}
.flow-plot{position:relative;flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end;border-bottom:1px solid var(--border)}
.flow-grid{position:absolute;left:0;right:0;border-top:1px solid var(--border)}
.flow-grid span{position:absolute;right:calc(100% + 6px);top:-7px;font-size:11px;color:var(--mfg);white-space:nowrap}
.flow-m{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;cursor:default}
.flow-m:hover{background:var(--hover)}
.flow-m i{display:block;width:min(16px,30%);border-radius:4px 4px 0 0;background:var(--c)}
.flow-x{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:5px 0 2px;font-size:11px;color:var(--mfg);text-align:center;text-transform:capitalize}
.amount{font-size:13.5px;font-weight:700;white-space:nowrap}
.amount.ok{color:var(--success)}

/* ── Lateral ── */
.dl{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:var(--muted);flex-shrink:0}
.dl b{font-size:16px;line-height:1;font-weight:700}
.dl span{font-size:11px;text-transform:uppercase;font-weight:600;color:var(--mfg)}
.dl.crit{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.dl.crit b,.dl.crit span{color:var(--danger)}
.area{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--mfg)}
.area i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.plabel{font-size:12px;font-weight:700;white-space:nowrap}
.plabel.critical{color:var(--danger)}.plabel.warning{color:var(--warning)}.plabel.neutral{color:var(--mfg)}
.fatal-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block}
.pend{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 8px}
.pend a{display:block;padding:10px 12px;border-radius:10px;background:var(--muted);text-decoration:none;color:inherit;cursor:pointer;transition:background .15s}
.pend a:hover{background:color-mix(in srgb,var(--fg) 7%,var(--muted))}
.pend b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.pend span{font-size:12.5px;color:var(--mfg);font-weight:500}
.pend em{display:flex;align-items:center;gap:4px;font-style:normal;font-size:12px;font-weight:600;color:var(--danger);margin-top:4px}
.portal-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 16px 8px}
.portal-top b{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
.portal-top span{display:block;font-size:12.5px;color:var(--mfg);margin-top:4px}
.portal-top svg{width:132px;height:30px;overflow:visible}
.wl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 10px}
.wl .bar2{grid-column:2/4;display:flex;gap:2px;height:5px}
.wl .bar2 span{height:100%;border-radius:3px}
.areas-chart{display:flex;flex-direction:column;gap:8px;padding:4px 8px 8px}
.areas-chart div{display:grid;grid-template-columns:96px minmax(0,1fr) 24px;align-items:center;gap:8px;font-size:12.5px;color:var(--mfg)}
.areas-chart i{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--c)}

/* ── Movimento ── */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter .anim{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.enter .anim,.pulse{animation:none}}

.tip{position:fixed;z-index:300;pointer-events:none;background:#1a1c22;color:#fff;font-size:12px;line-height:1.4;padding:6px 9px;border-radius:7px;max-width:280px;opacity:0;transition:opacity .12s;white-space:pre-line;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip.show{opacity:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:#1a1c22;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:16px;align-items:center;transition:.25s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:#a5b4fc;font-weight:700;font-size:13px;cursor:pointer;padding:0}
</style>

<script>
const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch])

    if (timed.length) return { d, item: timed[0] }
  }
  return null
}
function countdown(min) { const h = Math.floor(min / 60), m = min % 60; return h ? `em ${h} h${m ? ` ${m} min` : ''}` : `em ${m} min` }

  const items = agendaFor(0)

  const tasks = items.filter((x) => x.kind === 'task').length

  if (items.length) {

function dayView() {
  const d = state.day
  const list = agendaFor(d)
  const w = WEEK[d]
  if (!list.length) {
    const rest = WEEK.reduce((n, _, k) => n + (k === 0 ? 0 : agendaFor(k).length), 0)

    let sub = rest ? `${plural(rest, 'item', 'itens')} no resto da semana — veja nos dias acima.` : 'Nada nos próximos 7 dias.'
    if (d === 0 && !rest) title = 'Semana livre'
    if (d !== 0) { title = `Nada marcado para ${w.label.toLowerCase()}`; sub = 'Dia livre na agenda.' }
    return `<div class="hero-empty"><span class="chip-ic t-success">${ic('calendar-check', 's18')}</span><div><p>${title}</p><small>${sub}</small></div><button class="btn sm" data-act="toast" data-msg="Abre Novo compromisso já no dia escolhido">${ic('plus', 's14')}Agendar</button></div>`
  }
  const allDay = list.filter((x) => x.allDay)
  const timed = list.filter((x) => !x.allDay).sort((a, b) => toMin(a.start) - toMin(b.start))
  return `${ruler(timed, d === 0)}
    <div class="dayhead"><strong>${w.label}</strong><span>· ${plural(list.length, 'item', 'itens')}</span><a class="link" data-act="toast" data-msg="Abre a Agenda nesse dia">Abrir na Agenda ${ic('arrow-right', 's14')}</a></div>
    ${allDay.length ? `<div class="allday">${allDay.map((x) => `<span class="pill ${x.fatal ? 't-danger' : 't-warning'}" data-tip="${esc(x.client || '')}">${x.fatal ? '<span class="fatal-dot pulse"></span>' : ''}${x.fatal ? 'Prazo fatal' : 'Dia todo'} · ${esc(x.title)}</span>`).join('')}</div>` : ''}
    <div class="alist">${agendaRows(timed, d === 0)}</div>`
}

function ruler(timed, isToday) {
  if (!timed.length) return ''
  const start = 8 * 60, end = 19 * 60, span = end - start
  const pct = (m) => ((Math.min(Math.max(m, start), end) - start) / span) * 100
  const lanes = []
  const placed = timed.filter((x) => x.kind === 'event').map((x) => {
    const s = toMin(x.start), e = toMin(x.end)
    let lane = lanes.findIndex((le) => le <= s)
    if (lane === -1) { lane = lanes.length; lanes.push(e) } else lanes[lane] = e
    return { x, s, e, lane }
  })
  const nL = Math.max(1, lanes.length)
  const hours = []
  for (let h = 8; h <= 19; h++) hours.push(`<span style="left:${pct(h * 60)}%">${String(h).padStart(2, '0')}h</span>`)
  const grid = []
  for (let h = 9; h < 19; h++) grid.push(`<span class="gridh" style="left:${pct(h * 60)}%"></span>`)
  const blocks = placed.map(({ x, s, e, lane }) => {
    const t = TYPES[x.type]
    const h = 100 / nL
    return `<span class="block" data-act="toast" data-msg="Abre o detalhe do evento (EventDetailModal)" style="--c:${t.c};left:${pct(s)}%;width:${pct(e) - pct(s)}%;top:calc(${lane * h}% + 4px);height:calc(${h}% - 8px)" data-tip="${x.start}–${x.end} · ${esc(x.title)}\n${esc([t.label, x.client, x.place].filter(Boolean).join(' · '))}"></span>`
  }).join('')
  const pins = timed.filter((x) => x.kind === 'task').map((x) => `<span class="pin" data-act="toast" data-msg="Abre o detalhe da tarefa (TaskDetailModal)" style="left:${pct(toMin(x.start))}%" data-tip="${x.start} · Tarefa\n${esc(x.title)}"></span>`).join('')
  const now = isToday ? `<span class="past" style="width:${pct(NOW_MIN)}%"></span>` : ''
  const line = isToday ? `<span class="nowline" style="left:${pct(NOW_MIN)}%" data-tip="Agora · 13:25"></span>` : ''
  return `<div class="ruler"><div class="hours">${hours.join('')}</div><div class="track">${grid.join('')}${blocks}${pins}${now}</div>${line}</div>`
}

function agendaRows(timed, isToday) {
  let out = ''
  let nowDrawn = !isToday
  for (const x of timed) {
    const s = toMin(x.start), e = x.end ? toMin(x.end) : s
    if (!nowDrawn && s >= NOW_MIN) { out += `<div class="now-div">Agora · 13:25</div>`; nowDrawn = true }
    const past = isToday && (x.kind === 'event' ? e <= NOW_MIN : s < NOW_MIN)
    const current = isToday && x.kind === 'event' && s <= NOW_MIN && e > NOW_MIN
    const soon = isToday && !past && s - NOW_MIN <= 60 && s > NOW_MIN
    if (x.kind === 'task') {
      const done = state.done.has(x.id)
      out += `<div class="arow ${past && !done ? '' : ''}" data-act="toast" data-msg="Abre o detalhe da tarefa (TaskDetailModal)">
        <div class="atime num">${x.start}<small>tarefa</small></div><span class="abar" style="--c:var(--info)"></span>
        <div style="min-width:0"><div class="atitle"><button class="check ${done ? 'done' : ''}" data-act="task-done" data-id="${x.id}" aria-label="Concluir">${ic('check', 's14')}</button><span class="t ${done ? 'done-t' : ''}">${esc(x.title)}</span>${past && !done ? '<span class="pill t-danger">passou do horário</span>' : ''}</div><div class="ameta">${esc(['Tarefa', x.client].filter(Boolean).join(' · '))}</div></div>
        <div class="aend">${avatar(x.who)}</div></div>`
      continue
    }
    const t = TYPES[x.type]
    out += `<div class="arow ${past ? 'past' : ''} ${current ? 'current' : ''}" data-act="toast" data-msg="Abre o detalhe do evento (EventDetailModal)">
      <div class="atime num">${x.start}<small>${x.end}</small></div><span class="abar" style="--c:${t.c}"></span>
      <div style="min-width:0"><div class="atitle"><span class="t">${esc(x.title)}</span></div><div class="ameta">${esc([t.label, x.client, x.place].filter(Boolean).join(' · '))}</div></div>
      <div class="aend">${soon ? `<span class="pill t-accent">${ic('clock', 's14')}${countdown(s - NOW_MIN)}</span>` : ''}${current ? '<span class="pill t-accent">agora</span>' : ''}${avatar(x.who)}</div></div>`
  }
  if (!nowDrawn) out += `<div class="now-div">Agora · 13:25</div>`
  return out
}

// ── Indicadores ──
function sparkCols(values, fmtTip, w = 124, h = 32) {
  const max = Math.max(1, ...values)
  const n = values.length, gap = 3, bw = (w - gap * (n - 1)) / n
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${values.map((v, i) => {
    const bh = v === 0 ? 2 : Math.max(3, (v / max) * (h - 2))
    const x = i * (bw + gap)
    const fill = i === n - 1 ? 'var(--accent)' : 'var(--neutral-mark)'
    return `<g data-tip="${esc(fmtTip(i, v))}"><rect x="${x}" y="0" width="${bw + gap}" height="${h}" fill="transparent"/><rect x="${x}" y="${h - bh}" width="${bw}" height="${bh}" rx="1.5" fill="${fill}" opacity="${v === 0 ? .45 : 1}"/></g>`
  }).join('')}</svg>`
}
function stack(parts) {
  const total = parts.reduce((s, p) => s + p.v, 0)
  if (!total) return '<div class="stack empty"></div>'

function tasksCard(i) {
  const z = empty()
  const scope = state.scope
  const all = z ? [] : TASKS.filter((t) => scope === 'office' || t.who === 'LM')
  const pending = all.filter((t) => !state.done.has(t.id) || state.justDone === t.id)
  const groups = [
    ['overdue', 'Atrasadas', pending.filter((t) => t.due < TODAY)],
    ['today', 'Hoje', pending.filter((t) => t.due === TODAY)],
    ['week', 'Próximos 7 dias', pending.filter((t) => t.due > TODAY)],
  ]
  const limit = state.moreTasks ? 99 : 5
  let budget = limit, hidden = 0
  const ageDays = (d) => Math.round((Date.parse(TODAY) - Date.parse(d)) / 864e5)
  const dueLabel = (t, g) => {
    const [y, m, d] = t.due.split('-')
    if (g === 'overdue') { const a = ageDays(t.due); return `venceu ${d}/${m} · há ${a} ${a === 1 ? 'dia' : 'dias'}` }
    if (g === 'today') return t.time ? `hoje até ${t.time}` : 'hoje'
    const wd = new Date(+y, +m - 1, +d).toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '')
    return `${wd}, ${d}/${m}${t.time ? `, ${t.time}` : ''}`
  }
  const prio = { urgent: ['Urgente', 't-danger'], high: ['Alta', 't-warning'] }
  let body = ''
  for (const [key, label, rows] of groups) {
    const show = rows.slice(0, Math.max(0, budget)); hidden += rows.length - show.length; budget -= show.length
    if (!show.length) continue
    body += `<div class="subhead ${key === 'overdue' ? 'danger' : ''}">${label} · ${rows.length}</div>`
    body += show.map((t) => {
      const done = state.done.has(t.id)
      return `<div class="row" data-act="toast" data-msg="Abre o detalhe da tarefa (TaskDetailModal)"><button class="check ${done ? 'done' : ''}" data-act="task-done" data-id="${t.id}" aria-label="Concluir">${ic('check', 's14')}</button>

    }).join('')
  }
  if (!body) body = `<div class="empty"><span class="chip-ic t-success">${ic('circle-check', 's18')}</span><div><p>Tudo em dia</p><small>Nada atrasado nem para os próximos 7 dias.</small></div><button class="btn sm" data-act="toast" data-msg="Abre Nova tarefa">${ic('plus', 's14')}Nova tarefa</button></div>`
  const foot = `<span>${hidden ? `<button class="link strong" data-act="more">Mostrar mais ${hidden} ${ic('chevron-down', 's14')}</button>` : state.moreTasks ? `<button class="link" data-act="more">Mostrar menos</button>` : ''}</span><a class="link strong" data-act="toast" data-msg="Abre /tarefas">Ver quadro ${ic('arrow-right', 's14')}</a>`
  return `<section class="card anim o3" style="--i:${i}">
    <div class="card-h"><span class="chip-ic t-warning">${ic('list-checks')}</span><span class="card-t">Tarefas</span><div class="card-a"><div class="seg" role="radiogroup"><button class="${scope === 'mine' ? 'on' : ''}" data-act="scope" data-v="mine">Minhas</button><button class="${scope === 'office' ? 'on' : ''}" data-act="scope" data-v="office">Escritório</button></div></div></div>

/** HTML, not SVG: the plot stretches to the height of the column beside it, so
 * the chart never leaves a hole under itself — and the text never distorts. */
function flowChart(flow) {
  const max = Math.max(...flow.flatMap(([, r, d]) => [r, d]), 1)
  const nice = Math.ceil(max / 10000) * 10000
  const pct = (v) => (v / nice) * 100
  const grid = [nice / 2, nice].map((v) => `<div class="flow-grid" style="bottom:${pct(v)}%"><span>${(v / 1000).toLocaleString('pt-BR')} mil</span></div>`).join('')
  const months = flow.map(([m, r, d], idx) => `<div class="flow-m" data-tip="${m}${idx === flow.length - 1 ? ' (mês corrente)' : ''}\nReceitas ${brl(r)} · Despesas ${brl(d)}"><i style="--c:var(--success);height:${pct(r)}%"></i><i style="--c:var(--danger);height:${pct(d)}%"></i></div>`).join('')
  return `<div class="flow"><div class="flow-plot">${grid}${months}</div><div class="flow-x">${flow.map(([m]) => `<span>${m}</span>`).join('')}</div></div>`
}

  const body = tab === 'pessoas'
    ? TEAM.map((t) => { const p = PEOPLE[t.who]; const c = z ? 0 : t.cases; const max = 9
        return `<div class="row" style="display:block"><div class="wl">${avatar(t.who)}<div style="min-width:0"><div class="r-t" style="font-size:13.5px">${p.name}</div><div class="r-m">${p.oab}</div></div>
          <div style="text-align:right"><div class="r-t num" style="font-size:13.5px">${plural(c, 'caso', 'casos')}</div><div class="r-m" style="${!z && t.late ? 'color:var(--danger)' : ''}">${z ? 'nenhuma tarefa' : `${plural(t.open, 'tarefa', 'tarefas')}${t.late ? ` · ${t.late} atrasada${t.late > 1 ? 's' : ''}` : ''}`}</div></div>
          <div class="bar2" data-tip="${z ? 'Sem casos' : `${t.proc} em processo · ${t.neg} em negociação`}">${z ? '<span style="width:100%;background:var(--muted)"></span>' : `<span style="width:${(t.proc / max) * 100}%;background:var(--c1)"></span><span style="width:${(t.neg / max) * 100}%;background:var(--c2)"></span>`}</div></div></div>` }).join('')
      + (z ? '' : `<div class="legend" style="padding:4px 8px 6px"><span><i style="--c:var(--c1)"></i>Em processo</span><span><i style="--c:var(--c2)"></i>Em negociação</span></div>`)
    : (z ? `<div class="empty"><span class="chip-ic t-muted">${ic('scale', 's18')}</span><div><p>Nenhum caso com área definida</p></div></div>`
      : `<div class="areas-chart">${AREA_COUNTS.map(([a, n]) => `<div data-tip="${AREAS[a].label}: ${n} casos"><span>${AREAS[a].label}</span><i style="--c:${AREAS[a].c};width:${(n / 7) * 100}%"></i><b class="num" style="color:var(--fg)">${n}</b></div>`).join('')}</div>`)
  return `<section class="card anim o7" style="--i:${i}">
    <div class="card-h"><span class="chip-ic t-violet">${ic('users')}</span><span class="card-t">Equipe</span><div class="card-a"><div class="seg"><button class="${tab === 'pessoas' ? 'on' : ''}" data-act="team" data-v="pessoas">Pessoas</button><button class="${tab === 'areas' ? 'on' : ''}" data-act="team" data-v="areas">Áreas</button></div></div></div>
    <div class="card-b">${body}</div></section>`
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app')
  app.innerHTML = `${sidebar()}<div class="shell">${topbar()}<main class="main"><div class="dash ${firstPaint && !reduceMotion ? 'enter' : ''}">
    ${hero(0)}${kpis(1)}
    <div class="cols"><div class="col">${monitoring(5)}${tasksCard(6)}${finance(7)}</div><div class="col">${prazos(5)}${pendencias(6)}${portal(7)}${team(8)}</div></div>
  </div></main></div>`
  countUp(firstPaint)
  if (firstPaint) setTimeout(() => app.querySelector('.dash')?.classList.remove('enter'), 1400)
  firstPaint = false
  fit()
}

function countUp(fromZero) {
  document.querySelectorAll('[data-count]').forEach((el) => {
    const to = Number(el.dataset.count), key = el.dataset.key, fmt = int
    const from = fromZero ? 0 : (shown[key] ?? to)
    shown[key] = to
    if (from === to || reduceMotion) { el.textContent = fmt(to); return }
    const t0 = performance.now(), dur = 900
    const step = (t) => { const p = Math.min(1, (t - t0) / dur); el.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step) }
    el.textContent = fmt(from); requestAnimationFrame(step)
  })
}

let toastTimer
function toast(msg, undo) {
  const t = document.getElementById('toast'), u = document.getElementById('toast-undo')
  document.getElementById('toast-msg').textContent = msg
  u.hidden = !undo; u.onclick = () => { undo(); t.classList.remove('show') }
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200)
}

document.getElementById('app').addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]')
  if (!el) return
  ev.stopPropagation()
  const act = el.dataset.act, v = el.dataset.v
  if (act === 'day') { state.day = Number(v); render() }
  else if (act === 'mon-tab') { state.monTab = v; render() }
  else if (act === 'scope') { state.scope = v; state.moreTasks = false; render() }
  else if (act === 'team') { state.team = v; render() }
  else if (act === 'more') { state.moreTasks = !state.moreTasks; render() }
  else if (act === 'pop') { state.pop = !state.pop; render() }
  else if (act === 'task-done') {
    const id = el.dataset.id
    if (state.done.has(id)) { state.done.delete(id); render(); return }
    state.done.add(id); state.justDone = id; render()
    setTimeout(() => { state.justDone = null; render() }, 700)
    toast('Tarefa concluída', () => { state.done.delete(id); render() })
  }
  else if (act === 'pub-read') {
    const id = el.dataset.id, row = document.getElementById('row-' + id)
    row?.classList.add('leaving')
    setTimeout(() => { state.read.add(id); render(); toast('Publicação marcada como lida', () => { state.read.delete(id); render() }) }, 220)
  }
  else if (act === 'toast') toast(el.dataset.msg)
})
document.addEventListener('click', (ev) => { if (state.pop && !ev.target.closest('.pop,[data-act=pop]')) { state.pop = false; render() } })

document.querySelectorAll('[data-ctl]').forEach((group) => group.addEventListener('click', (ev) => {
  const b = ev.target.closest('button'); if (!b) return
  group.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b))
  const ctl = group.dataset.ctl, v = b.dataset.v
  if (ctl === 'scenario') { state.scenario = v; state.day = 0; state.done.clear(); state.read.clear(); state.pop = false; firstPaint = true; for (const k in shown) delete shown[k] }
  if (ctl === 'theme') { state.theme = v; document.getElementById('device').dataset.theme = v }
  if (ctl === 'device') { state.device = Number(v); const d = document.getElementById('device'); d.classList.toggle('phone', v === '390'); d.style.width = v + 'px' }
  render()
}))

const tip = document.getElementById('tip')
document.addEventListener('mouseover', (ev) => { const el = ev.target.closest('[data-tip]'); if (!el) { tip.classList.remove('show'); return } tip.textContent = el.dataset.tip; tip.classList.add('show') })
document.addEventListener('mousemove', (ev) => { if (!tip.classList.contains('show')) return; const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (ev.clientY + 16) + 'px' })
document.addEventListener('mouseout', (ev) => { if (!ev.relatedTarget || !ev.relatedTarget.closest?.('[data-tip]')) tip.classList.remove('show') })

function fit() {
  const d = document.getElementById('device'), stage = document.getElementById('stage')
  const avail = stage.clientWidth - 32
  d.style.zoom = Math.min(1, avail / state.device)
}
addEventListener('resize', fit)

// ?cenario=vazia&tema=dark&tela=390 — the same as clicking the toolbar.
const params = new URLSearchParams(location.search)
for (const [ctl, key] of [['scenario', 'cenario'], ['theme', 'tema'], ['device', 'tela']]) {
  const v = params.get(key)
  if (!v) continue
  document.querySelector(`[data-ctl=${ctl}] button[data-v="${v}"]`)?.click()
}
render()
if (params.get('scroll')) scrollTo(0, Number(params.get('scroll')))
</script>
</body>
</html>
